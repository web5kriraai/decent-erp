name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: decent_erp_test
          POSTGRES_USER: decent_user
          POSTGRES_PASSWORD: decent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://decent_user:decent_test@localhost:5432/decent_erp_test
      NEXTAUTH_SECRET: test-secret-min-32-characters-long
      AUTH_SECRET: test-secret-min-32-characters-long
      NEXTAUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Migrate
        run: npx prisma migrate deploy
      - name: Seed
        run: npm run db:seed
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
        env:
          CI: true
