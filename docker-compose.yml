services:
  postgres:
    image: postgres:16-alpine
    container_name: decent-erp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-decent_erp}
      POSTGRES_USER: ${POSTGRES_USER:-decent_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-decent_user} -d ${POSTGRES_DB:-decent_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - decent-erp-net

  redis:
    image: redis:7-alpine
    container_name: decent-erp-redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - decent-erp-net

  minio:
    image: minio/minio:latest
    container_name: decent-erp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - decent-erp-net

  minio-init:
    image: minio/mc:latest
    container_name: decent-erp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin123};
      mc mb --ignore-existing local/${S3_BUCKET:-decent-designs};
      mc anonymous set none local/${S3_BUCKET:-decent-designs};
      exit 0;
      "
    networks:
      - decent-erp-net

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: decent-erp-migrate
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-decent_user}:${POSTGRES_PASSWORD:-decent_dev_password}@postgres:5432/${POSTGRES_DB:-decent_erp}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - decent-erp-net
    profiles:
      - tools

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: decent-erp-app
    restart: unless-stopped
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-decent_user}:${POSTGRES_PASSWORD:-decent_dev_password}@postgres:5432/${POSTGRES_DB:-decent_erp}
      REDIS_URL: redis://redis:6379
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-decent-designs}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin123}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      JWT_EXPIRY: ${JWT_EXPIRY:-8h}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    networks:
      - decent-erp-net

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: decent-erp-worker
    restart: unless-stopped
    command: npx tsx src/worker/notification-worker.ts
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-decent_user}:${POSTGRES_PASSWORD:-decent_dev_password}@postgres:5432/${POSTGRES_DB:-decent_erp}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - decent-erp-net

  nginx:
    image: nginx:alpine
    container_name: decent-erp-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - decent-erp-net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  minio_config:

networks:
  decent-erp-net:
    driver: bridge
